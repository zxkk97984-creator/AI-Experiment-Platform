server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 全局默认：普通 JSON API 请求体上限 1 MiB，超限返回 413
    client_max_body_size 1m;

    # ── 安全响应头（TASK-030；责任层见 docs/security/tls-topology.md）──
    # 本层是 HTTP 内层：绝不在此设置 HSTS（仅真实 HTTPS 终止层负责）。
    # `always`：错误响应（502/504 等）同样携带头部。
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 禁止非预期 frame：平台不被跨源嵌入；同源 iframe（Notebook/Jupyter）不受影响
    add_header X-Frame-Options SAMEORIGIN always;
    # CSP 仅 report-only：违规只上报不阻断，观察稳定后再收紧（禁止直接启用强制 CSP）
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # API 代理（保持请求体缓冲，使 client_max_body_size 在边界生效）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传/响应超时放宽到 600 秒以上
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 作业/考试名单导入：仅这两条上传路径放宽到 3 MiB（业务上限仍是 2 MiB，
    # 多余额度用于 multipart 边界与字段开销）。其他普通 API 保持 1 MiB。
    location ~ ^/api/v1/(assignments|exams)/[0-9]+/audience/import$ {
        client_max_body_size 3m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Roster files: application limits remain 5/2 MiB; allow multipart overhead.
    location ~ ^/api/v1/admin/(roster-imports/preview|password-resets/preview-file)$ {
        client_max_body_size 6m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~ ^/api/v1/courses/[0-9]+/students/import$ {
        client_max_body_size 3m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 教师视频上传：512 MiB（与后端 500 MiB 业务限额 + multipart 开销一致）。
    # 大文件上传：请求体不落 Nginx 临时文件，避免磁盘容量瓶颈
    location ~ ^/api/v1/lessons/[0-9]+/video-file$ {
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Shared materials: per-file 100/500 MiB limits are enforced by the API.
    location ~ ^/api/v1/materials/[0-9]+/file$ {
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 课程封面上传：6 MiB（与后端 5 MiB 业务限额 + multipart 开销一致）
    location ~ ^/api/v1/courses/[0-9]+/cover$ {
        client_max_body_size 6m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Bounded lab datasets/models (500 MiB application cap + multipart overhead).
    location ~ ^/api/v1/labs/(datasets|records/[0-9]+/artifacts|entries/(lesson|module)/[0-9]+/reference-artifacts)$ {
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Studio 模板导入：50 MiB（与后端 studio_service.MAX_IMPORT_BYTES 一致）
    location ~ ^/api/v1/studio/templates/(import|[0-9]+/import)$ {
        client_max_body_size 50m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 视频媒体端点：关闭响应缓冲，保留 Range / Content-Range / Accept-Ranges 头
    location /api/v1/media/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 健康检查
    location /health {
        proxy_pass http://api:8000/api/v1/health/live;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
