[pytest]
# 默认只收集 automated 组；tests/native_http 是需要真实 Uvicorn 子进程的独立组，
# 必须显式运行（CI 有独立 job）：cd backend && python -m pytest -q tests/native_http
testpaths = tests/automated
pythonpath = .
markers =
    no_auto_env_seed: test manages environment control-plane seed data explicitly
    native_http: 真实 Uvicorn 子进程集成组（独立目录，显式运行）
