secrets:
  # The default file is deliberately auths-only and contains no credential.
  # Production should point DAI_ENV_REGISTRY_DOCKER_CONFIG_FILE at a
  # root-owned, read-only Docker config Secret on the host.
  dai_env_registry_docker_config:
    file: ${DAI_ENV_REGISTRY_DOCKER_CONFIG_FILE:-./deploy/registry-docker-config.example.json}

# Production builds accept digest-pinned base image references through the
# approved .env.  The tag defaults keep disposable CI/dev config usable; the
# deployment checklist requires real digests before a production build.
x-backend-build: &backend-build
  context: ./backend
  args:
    DAI_BACKEND_BASE_IMAGE: ${DAI_BACKEND_BASE_IMAGE:?DAI_BACKEND_BASE_IMAGE 必须是已审核的 digest 镜像引用}

x-frontend-build: &frontend-build
  context: ./frontend
  args:
    DAI_FRONTEND_NODE_BASE_IMAGE: ${DAI_FRONTEND_NODE_BASE_IMAGE:?DAI_FRONTEND_NODE_BASE_IMAGE 必须是已审核的 digest 镜像引用}
    DAI_FRONTEND_NGINX_BASE_IMAGE: ${DAI_FRONTEND_NGINX_BASE_IMAGE:?DAI_FRONTEND_NGINX_BASE_IMAGE 必须是已审核的 digest 镜像引用}

services:
  mysql:
    image: ${DAI_MYSQL_IMAGE:?DAI_MYSQL_IMAGE 必须是已审核的 digest 镜像引用}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DAI_DB_ROOT_PASSWORD:?DAI_DB_ROOT_PASSWORD 未设置，生产环境必须提供}
      MYSQL_DATABASE: dai_platform
      MYSQL_USER: ${DAI_DB_USER:?DAI_DB_USER 未设置，生产环境必须提供}
      MYSQL_PASSWORD: ${DAI_DB_PASSWORD:?DAI_DB_PASSWORD 未设置，生产环境必须提供}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${DAI_REDIS_IMAGE:?DAI_REDIS_IMAGE 必须是已审核的 digest 镜像引用}
    restart: unless-stopped
    # AOF everysec + 命名卷：容器重建后 Refresh Token、黑名单与短期唤醒状态不丢失。
    # 故障语义：Redis 丢失时全部 Refresh 失效（需重新登录）、黑名单最多影响
    # Access Token 剩余有效期（≤30 分钟）、判题任务事实源在 MySQL 可恢复。
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 一次性迁移执行者：统一 bootstrap 成功后 API/Worker 才启动。
  # 失败时 API、Judge Worker、environment-builder 都不会启动
  #（depends_on service_completed_successfully）。
  # 注意：迁移链在 b4c5d6e7f890 后要求 basic 环境已有 available 版本
  # （seed-environments + 构建完成），全新部署需按部署文档执行中间步骤后重跑本服务。
  migrate:
    build: *backend-build
    restart: "no"
    command: ["python", "/scripts/bootstrap_database.py"]
    environment:
      DAI_ENVIRONMENT: ${DAI_ENVIRONMENT:-production}
      DAI_MIGRATION_MODE: ${DAI_MIGRATION_MODE:-production}
      DAI_DATABASE_URL: mysql+pymysql://${DAI_DB_USER:?DAI_DB_USER 未设置}:${DAI_DB_PASSWORD:?DAI_DB_PASSWORD 未设置}@mysql:3306/dai_platform
      DAI_SECRET_KEY: ${DAI_SECRET_KEY:?DAI_SECRET_KEY 未设置，生产环境必须提供}
      DAI_CORS_ORIGINS: ${DAI_CORS_ORIGINS:?DAI_CORS_ORIGINS 未设置，生产环境必须指定前端域名}
      DAI_JUDGE_IMAGE: ${DAI_JUDGE_IMAGE:?DAI_JUDGE_IMAGE 必须是已 smoke 的 digest 镜像引用}
      DAI_KERNEL_IMAGE: ${DAI_KERNEL_IMAGE:?DAI_KERNEL_IMAGE 必须是已 smoke 的 digest 镜像引用}
      DAI_ENV_BASE_IMAGE: "${DAI_ENV_BASE_IMAGE:?DAI_ENV_BASE_IMAGE 必须是带 @sha256: digest 的 python:3.12-slim 引用}"
      DAI_BASIC_ENVIRONMENT_IMAGE_DIGEST: ${DAI_BASIC_ENVIRONMENT_IMAGE_DIGEST:-}
      DAI_ENVIRONMENT_EDITOR_V2_ENABLED: ${DAI_ENVIRONMENT_EDITOR_V2_ENABLED:-false}
      DAI_ENV_REGISTRY_REPOSITORY: ${DAI_ENV_REGISTRY_REPOSITORY:-}
      DAI_ENV_REGISTRY_DOCKER_CONFIG: /run/secrets/config.json
      DAI_ENV_REGISTRY_ALLOW_ANONYMOUS: ${DAI_ENV_REGISTRY_ALLOW_ANONYMOUS:-false}
      DAI_ENV_PYTHON_BASE_IMAGES: '${DAI_ENV_PYTHON_BASE_IMAGES:-{"3.10":"python:3.10-slim-bookworm","3.11":"python:3.11-slim-bookworm","3.12":"python:3.12-slim-bookworm"}}'
      DAI_ENV_PIP_INDEX_URL: ${DAI_ENV_PIP_INDEX_URL:-}
      DAI_ENV_APT_SNAPSHOT_SOURCES: '${DAI_ENV_APT_SNAPSHOT_SOURCES:-{}}'
      DAI_ENV_PLATFORM_PYTHON_PACKAGES: '${DAI_ENV_PLATFORM_PYTHON_PACKAGES:-{"ipykernel":"6.29.5","pytest":"8.3.4"}}'
      DAI_ENV_PLATFORM_BUNDLE_VERSION: ${DAI_ENV_PLATFORM_BUNDLE_VERSION:-v1}
      DAI_ENV_BUILD_NETWORK_MODE: ${DAI_ENV_BUILD_NETWORK_MODE:-default}
      DAI_ENV_BUILD_HTTP_PROXY: ${DAI_ENV_BUILD_HTTP_PROXY:-}
      DAI_ENV_BUILD_CPU_LIMIT: ${DAI_ENV_BUILD_CPU_LIMIT:-2}
      DAI_ENV_BUILD_MEMORY_MB: ${DAI_ENV_BUILD_MEMORY_MB:-4096}
      DAI_ENV_BUILD_PIDS_LIMIT: ${DAI_ENV_BUILD_PIDS_LIMIT:-512}
      DAI_ENV_BUILD_MAX_IMAGE_BYTES: ${DAI_ENV_BUILD_MAX_IMAGE_BYTES:-21474836480}
      DAI_JUDGE_HOST_WORK_DIR: ${DAI_JUDGE_HOST_WORK_DIR:?DAI_JUDGE_HOST_WORK_DIR 必须是宿主机判题目录的绝对路径}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal
    secrets:
      - source: dai_env_registry_docker_config
        target: config.json
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions:ro
      - ./scripts/bootstrap_database.py:/scripts/bootstrap_database.py:ro
      - ./scripts/seed-basic-environment-mysql.py:/scripts/seed-basic-environment-mysql.py:ro

  api:
    build: *backend-build
    restart: unless-stopped
    # 迁移由一次性 migrate 服务执行；API 启动只跑 Uvicorn
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    # stdout 日志轮转（docker logs 不无限膨胀）；文件日志见下方 DAI_LOG_DIR 卷
    logging: &api_logging
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment: &api_environment
      DAI_ENVIRONMENT: ${DAI_ENVIRONMENT:-production}
      DAI_DATABASE_URL: mysql+pymysql://${DAI_DB_USER:?DAI_DB_USER 未设置}:${DAI_DB_PASSWORD:?DAI_DB_PASSWORD 未设置}@mysql:3306/dai_platform
      DAI_ACCOUNT_SECURITY_KEYS: ${DAI_ACCOUNT_SECURITY_KEYS:-}
      DAI_ACCOUNT_WORKER_HASH_CONCURRENCY: ${DAI_ACCOUNT_WORKER_HASH_CONCURRENCY:-2}
      DAI_REDIS_URL: redis://redis:6379/0
      # 文件日志（管理员系统日志页直读；20MB×10 轮转）
      DAI_LOG_DIR: /app/logs
      DAI_SECRET_KEY: ${DAI_SECRET_KEY:?DAI_SECRET_KEY 未设置，生产环境必须提供}
      DAI_CORS_ORIGINS: ${DAI_CORS_ORIGINS:?DAI_CORS_ORIGINS 未设置，生产环境必须指定前端域名}
      # 文件存储后端保持 provider-neutral：默认 local，S3-compatible 部署
      # 通过这些配置切换，业务 Service 和数据库 object_key 不变。
      DAI_STORAGE_BACKEND: ${DAI_STORAGE_BACKEND:-local}
      DAI_STORAGE_S3_ENDPOINT_URL: ${DAI_STORAGE_S3_ENDPOINT_URL:-}
      DAI_STORAGE_S3_BUCKET: ${DAI_STORAGE_S3_BUCKET:-dai-platform}
      DAI_STORAGE_S3_REGION: ${DAI_STORAGE_S3_REGION:-us-east-1}
      DAI_STORAGE_S3_ACCESS_KEY_ID: ${DAI_STORAGE_S3_ACCESS_KEY_ID:-}
      DAI_STORAGE_S3_SECRET_ACCESS_KEY: ${DAI_STORAGE_S3_SECRET_ACCESS_KEY:-}
      DAI_STORAGE_S3_SESSION_TOKEN: ${DAI_STORAGE_S3_SESSION_TOKEN:-}
      DAI_STORAGE_S3_ADDRESSING_STYLE: ${DAI_STORAGE_S3_ADDRESSING_STYLE:-auto}
      DAI_STORAGE_S3_KEY_PREFIX: ${DAI_STORAGE_S3_KEY_PREFIX:-}
      DAI_JUDGE_IMAGE: ${DAI_JUDGE_IMAGE:?DAI_JUDGE_IMAGE 必须是已 smoke 的 digest 镜像引用}
      DAI_KERNEL_IMAGE: ${DAI_KERNEL_IMAGE:?DAI_KERNEL_IMAGE 必须是已 smoke 的 digest 镜像引用}
      # 登录限流：仅信任显式配置的直接代理 peer 与已清洗的代理链。
      # 留空时 fail-closed 使用直连 peer；生产需按真实网络填写 CIDR。
      DAI_TRUSTED_PROXY_CIDRS: ${DAI_TRUSTED_PROXY_CIDRS:-}
      # 环境档位基础镜像——生产校验强制带 @sha256: digest（config.py 拒绝可变标签）
      DAI_ENV_BASE_IMAGE: "${DAI_ENV_BASE_IMAGE:?DAI_ENV_BASE_IMAGE 必须是带 @sha256: digest 的 python:3.12-slim 引用}"
      DAI_ENVIRONMENT_EDITOR_V2_ENABLED: ${DAI_ENVIRONMENT_EDITOR_V2_ENABLED:-false}
      DAI_ENV_REGISTRY_REPOSITORY: ${DAI_ENV_REGISTRY_REPOSITORY:-}
      DAI_ENV_REGISTRY_DOCKER_CONFIG: /run/secrets/config.json
      DAI_ENV_REGISTRY_ALLOW_ANONYMOUS: ${DAI_ENV_REGISTRY_ALLOW_ANONYMOUS:-false}
      DOCKER_CONFIG: /run/secrets
      DAI_ENV_PYTHON_BASE_IMAGES: '${DAI_ENV_PYTHON_BASE_IMAGES:-{"3.10":"python:3.10-slim-bookworm","3.11":"python:3.11-slim-bookworm","3.12":"python:3.12-slim-bookworm"}}'
      DAI_ENV_PIP_INDEX_URL: ${DAI_ENV_PIP_INDEX_URL:-}
      DAI_ENV_APT_SNAPSHOT_SOURCES: '${DAI_ENV_APT_SNAPSHOT_SOURCES:-{}}'
      DAI_ENV_PLATFORM_PYTHON_PACKAGES: '${DAI_ENV_PLATFORM_PYTHON_PACKAGES:-{"ipykernel":"6.29.5","pytest":"8.3.4"}}'
      DAI_ENV_PLATFORM_BUNDLE_VERSION: ${DAI_ENV_PLATFORM_BUNDLE_VERSION:-v1}
      DAI_ENV_BUILD_NETWORK_MODE: ${DAI_ENV_BUILD_NETWORK_MODE:-default}
      DAI_ENV_BUILD_HTTP_PROXY: ${DAI_ENV_BUILD_HTTP_PROXY:-}
      DAI_ENV_BUILD_CPU_LIMIT: ${DAI_ENV_BUILD_CPU_LIMIT:-2}
      DAI_ENV_BUILD_MEMORY_MB: ${DAI_ENV_BUILD_MEMORY_MB:-4096}
      DAI_ENV_BUILD_PIDS_LIMIT: ${DAI_ENV_BUILD_PIDS_LIMIT:-512}
      DAI_ENV_BUILD_MAX_IMAGE_BYTES: ${DAI_ENV_BUILD_MAX_IMAGE_BYTES:-21474836480}
      DAI_ENV_BUILDER_HEARTBEAT_KEY: ${DAI_ENV_BUILDER_HEARTBEAT_KEY:-environment:v2:builder:heartbeat}
      DAI_ENV_BUILDER_HEARTBEAT_TTL_SECONDS: ${DAI_ENV_BUILDER_HEARTBEAT_TTL_SECONDS:-30}
      DAI_ENV_BUILDER_HEARTBEAT_INTERVAL_SECONDS: ${DAI_ENV_BUILDER_HEARTBEAT_INTERVAL_SECONDS:-10}
      DAI_STUDIO_STORAGE_DIR: /app/storage/studio
      DAI_LAB_ENABLED: ${DAI_LAB_ENABLED:-true}
      # General API/worker must know the reserved daemon; efficiency is opt-in.
      DAI_LAB_WORKER_MODE: ${DAI_LAB_WORKER_MODE:-general}
      DAI_LAB_WORKER_NODE_ID: ${DAI_LAB_WORKER_NODE_ID:-}
      DAI_LAB_BENCHMARK_NODE_ID: ${DAI_LAB_BENCHMARK_NODE_ID:-}
      DAI_LAB_STORAGE_DIR: /app/storage/lab
      DAI_LAB_TRAINING_CONCURRENCY: ${DAI_LAB_TRAINING_CONCURRENCY:-1}
      DAI_LAB_TOTAL_CPUS: ${DAI_LAB_TOTAL_CPUS:-4}
      DAI_LAB_TOTAL_MEMORY_MB: ${DAI_LAB_TOTAL_MEMORY_MB:-8192}
      DAI_LAB_INTERACTIVE_RESERVED_MEMORY_MB: ${DAI_LAB_INTERACTIVE_RESERVED_MEMORY_MB:-2048}
      DAI_LAB_MAX_KERNELS: ${DAI_LAB_MAX_KERNELS:-20}
      DAI_LAB_GPU_ENABLED: ${DAI_LAB_GPU_ENABLED:-false}
      DAI_LAB_GPU_DEVICES: ${DAI_LAB_GPU_DEVICES:-}
      DAI_LAB_UPLOAD_MAX_BYTES: ${DAI_LAB_UPLOAD_MAX_BYTES:-524288000}
      DAI_LAB_EXPANDED_MAX_BYTES: ${DAI_LAB_EXPANDED_MAX_BYTES:-2147483648}
      DAI_LAB_ARTIFACT_QUOTA_BYTES: ${DAI_LAB_ARTIFACT_QUOTA_BYTES:-2147483648}
      DAI_LAB_MIN_FREE_DISK_MB: ${DAI_LAB_MIN_FREE_DISK_MB:-2048}
      DAI_JUDGE_WORK_DIR: /judge-work
      # 宿主机侧判题工作目录绝对路径——Worker 将此路径传给 Docker daemon 做 bind mount
      # 开发环境无需设置（自动回退到 DAI_JUDGE_WORK_DIR）
      DAI_JUDGE_HOST_WORK_DIR: ${DAI_JUDGE_HOST_WORK_DIR:?DAI_JUDGE_HOST_WORK_DIR 必须是宿主机判题目录的绝对路径}
      # ── 教师上传视频 ──
      DAI_VIDEO_STORAGE_DIR: /app/storage/videos
      DAI_VIDEO_MAX_UPLOAD_BYTES: ${DAI_VIDEO_MAX_UPLOAD_BYTES:-524288000}
      DAI_VIDEO_PLAYBACK_URL_TTL_SECONDS: ${DAI_VIDEO_PLAYBACK_URL_TTL_SECONDS:-3600}
      # ── 课程封面 ──
      DAI_COVER_STORAGE_DIR: /app/storage/covers
      DAI_COVER_MAX_UPLOAD_BYTES: ${DAI_COVER_MAX_UPLOAD_BYTES:-5242880}
      DAI_MATERIAL_STORAGE_DIR: /app/storage/materials
      DAI_MATERIAL_MAX_UPLOAD_BYTES: ${DAI_MATERIAL_MAX_UPLOAD_BYTES:-104857600}
      DAI_MATERIAL_LARGE_MAX_UPLOAD_BYTES: ${DAI_MATERIAL_LARGE_MAX_UPLOAD_BYTES:-524288000}
      DAI_MATERIAL_URL_TTL_SECONDS: ${DAI_MATERIAL_URL_TTL_SECONDS:-900}
      # ── AI 智能代码评分（TASK-020：审批前默认关闭，未审批环境无法意外启用） ──
      DAI_AI_ENABLED: ${DAI_AI_ENABLED:-false}
      DAI_AI_BASE_URL: ${DAI_AI_BASE_URL:-https://aihub.codingpython.cn}
      DAI_AI_API_KEY: ${DAI_AI_API_KEY:-}
      DAI_AI_MODEL: ${DAI_AI_MODEL:-deepseek-v4-flash}
      DAI_AI_TIMEOUT_SECONDS: ${DAI_AI_TIMEOUT_SECONDS:-60}
      DAI_AI_MAX_RETRIES: ${DAI_AI_MAX_RETRIES:-3}
      DAI_AI_TEST_GROUP_TIMEOUT_SECONDS: ${DAI_AI_TEST_GROUP_TIMEOUT_SECONDS:-120}
      DAI_AI_TEST_GROUP_MAX_RETRIES: ${DAI_AI_TEST_GROUP_MAX_RETRIES:-0}
      DAI_AI_QUEUE_NAME: ${DAI_AI_QUEUE_NAME:-judge:ai:queue}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    secrets:
      - source: dai_env_registry_docker_config
        target: config.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${DAI_JUDGE_HOST_WORK_DIR:?DAI_JUDGE_HOST_WORK_DIR 必须设置}:/judge-work"
      - ./backend/alembic/versions:/app/alembic/versions:ro
      - studio_data:/app/storage/studio
      - lab_data:/app/storage/lab
      - video_data:/app/storage/videos
      - cover_data:/app/storage/covers
      - material_data:/app/storage/materials
      - app_logs:/app/logs

  lab-worker:
    build: *backend-build
    restart: unless-stopped
    command: ["python", "-m", "app.worker.lab_worker"]
    logging: *api_logging
    environment:
      <<: *api_environment
      DAI_ENVIRONMENT_EDITOR_V2_ENABLED: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:size=3g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 2
    mem_limit: 4g
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${DAI_JUDGE_HOST_WORK_DIR:?DAI_JUDGE_HOST_WORK_DIR 必须设置}:/judge-work"
      - studio_data:/app/storage/studio
      - lab_data:/app/storage/lab
      - app_logs:/app/logs

  account-worker:
    build: *backend-build
    restart: unless-stopped
    command: ["python", "-m", "app.worker.account_worker"]
    environment:
      <<: *api_environment
      # This process does not build environments or call AI; no Registry secret/socket needed.
      DAI_ENVIRONMENT_EDITOR_V2_ENABLED: "false"
      DAI_AI_ENABLED: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 2
    mem_limit: 512m

  worker:
    build: *backend-build
    restart: unless-stopped
    command: python -m app.worker.judge_worker
    logging: *api_logging
    environment:
      DAI_ENVIRONMENT: ${DAI_ENVIRONMENT:-production}
      DAI_DATABASE_URL: mysql+pymysql://${DAI_DB_USER:?DAI_DB_USER 未设置}:${DAI_DB_PASSWORD:?DAI_DB_PASSWORD 未设置}@mysql:3306/dai_platform
      DAI_LOG_DIR: /app/logs
      DAI_REDIS_URL: redis://redis:6379/0
      DAI_SECRET_KEY: ${DAI_SECRET_KEY:?DAI_SECRET_KEY 未设置，生产环境必须提供}
      DAI_CORS_ORIGINS: ${DAI_CORS_ORIGINS:?DAI_CORS_ORIGINS 未设置，生产环境必须指定前端域名}
      DAI_JUDGE_IMAGE: ${DAI_JUDGE_IMAGE:?DAI_JUDGE_IMAGE 必须是已 smoke 的 digest 镜像引用}
      DAI_KERNEL_IMAGE: ${DAI_KERNEL_IMAGE:?DAI_KERNEL_IMAGE 必须是已 smoke 的 digest 镜像引用}
      DAI_ENV_BASE_IMAGE: "${DAI_ENV_BASE_IMAGE:?DAI_ENV_BASE_IMAGE 必须是带 @sha256: digest 的 python:3.12-slim 引用}"
      DAI_ENVIRONMENT_EDITOR_V2_ENABLED: ${DAI_ENVIRONMENT_EDITOR_V2_ENABLED:-false}
      DAI_ENV_REGISTRY_REPOSITORY: ${DAI_ENV_REGISTRY_REPOSITORY:-}
      DAI_ENV_REGISTRY_DOCKER_CONFIG: /run/secrets/config.json
      DAI_ENV_REGISTRY_ALLOW_ANONYMOUS: ${DAI_ENV_REGISTRY_ALLOW_ANONYMOUS:-false}
      DOCKER_CONFIG: /run/secrets
      DAI_ENV_PYTHON_BASE_IMAGES: '${DAI_ENV_PYTHON_BASE_IMAGES:-{"3.10":"python:3.10-slim-bookworm","3.11":"python:3.11-slim-bookworm","3.12":"python:3.12-slim-bookworm"}}'
      DAI_ENV_PIP_INDEX_URL: ${DAI_ENV_PIP_INDEX_URL:-}
      DAI_ENV_APT_SNAPSHOT_SOURCES: '${DAI_ENV_APT_SNAPSHOT_SOURCES:-{}}'
      DAI_ENV_PLATFORM_PYTHON_PACKAGES: '${DAI_ENV_PLATFORM_PYTHON_PACKAGES:-{"ipykernel":"6.29.5","pytest":"8.3.4"}}'
      DAI_ENV_PLATFORM_BUNDLE_VERSION: ${DAI_ENV_PLATFORM_BUNDLE_VERSION:-v1}
      DAI_ENV_BUILD_NETWORK_MODE: ${DAI_ENV_BUILD_NETWORK_MODE:-default}
      DAI_ENV_BUILD_HTTP_PROXY: ${DAI_ENV_BUILD_HTTP_PROXY:-}
      DAI_ENV_BUILD_CPU_LIMIT: ${DAI_ENV_BUILD_CPU_LIMIT:-2}
      DAI_ENV_BUILD_MEMORY_MB: ${DAI_ENV_BUILD_MEMORY_MB:-4096}
      DAI_ENV_BUILD_PIDS_LIMIT: ${DAI_ENV_BUILD_PIDS_LIMIT:-512}
      DAI_ENV_BUILD_MAX_IMAGE_BYTES: ${DAI_ENV_BUILD_MAX_IMAGE_BYTES:-21474836480}
      DAI_ENV_BUILDER_HEARTBEAT_KEY: ${DAI_ENV_BUILDER_HEARTBEAT_KEY:-environment:v2:builder:heartbeat}
      DAI_ENV_BUILDER_HEARTBEAT_TTL_SECONDS: ${DAI_ENV_BUILDER_HEARTBEAT_TTL_SECONDS:-30}
      DAI_ENV_BUILDER_HEARTBEAT_INTERVAL_SECONDS: ${DAI_ENV_BUILDER_HEARTBEAT_INTERVAL_SECONDS:-10}
      DAI_STUDIO_STORAGE_DIR: /app/storage/studio
      DAI_JUDGE_WORK_DIR: /judge-work
      DAI_JUDGE_HOST_WORK_DIR: ${DAI_JUDGE_HOST_WORK_DIR:?DAI_JUDGE_HOST_WORK_DIR 必须是宿主机判题目录的绝对路径}
      DAI_WORKER_ROLE: judge
      # ── AI 智能代码评分（TASK-020：默认关闭） ──
      DAI_AI_ENABLED: ${DAI_AI_ENABLED:-false}
      DAI_AI_BASE_URL: ${DAI_AI_BASE_URL:-https://aihub.codingpython.cn}
      DAI_AI_API_KEY: ${DAI_AI_API_KEY:-}
      DAI_AI_MODEL: ${DAI_AI_MODEL:-deepseek-v4-flash}
      DAI_AI_TIMEOUT_SECONDS: ${DAI_AI_TIMEOUT_SECONDS:-60}
      DAI_AI_MAX_RETRIES: ${DAI_AI_MAX_RETRIES:-3}
      DAI_AI_TEST_GROUP_TIMEOUT_SECONDS: ${DAI_AI_TEST_GROUP_TIMEOUT_SECONDS:-120}
      DAI_AI_TEST_GROUP_MAX_RETRIES: ${DAI_AI_TEST_GROUP_MAX_RETRIES:-0}
      DAI_AI_QUEUE_NAME: ${DAI_AI_QUEUE_NAME:-judge:ai:queue}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    secrets:
      - source: dai_env_registry_docker_config
        target: config.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${DAI_JUDGE_HOST_WORK_DIR:?DAI_JUDGE_HOST_WORK_DIR 必须设置}:/judge-work"
      - ./backend/alembic/versions:/app/alembic/versions:ro
      - studio_data:/app/storage/studio
      - app_logs:/app/logs

  # AI 慢调用单独隔离；默认 profile 不启动，且 DAI_AI_ENABLED=false 时不消费。
  # 该进程只处理 AI 队列，不执行 Docker 判题，因此不得继承 worker 的
  # Docker socket、judge-work 宿主目录或 Registry Secret。
  ai-worker:
    build: *backend-build
    restart: unless-stopped
    profiles:
      - ai
    command: python -m app.worker.judge_worker
    logging: *api_logging
    environment:
      DAI_ENVIRONMENT: ${DAI_ENVIRONMENT:-production}
      DAI_DATABASE_URL: mysql+pymysql://${DAI_DB_USER:?DAI_DB_USER 未设置}:${DAI_DB_PASSWORD:?DAI_DB_PASSWORD 未设置}@mysql:3306/dai_platform
      DAI_LOG_DIR: /app/logs
      DAI_REDIS_URL: redis://redis:6379/0
      DAI_SECRET_KEY: ${DAI_SECRET_KEY:?DAI_SECRET_KEY 未设置，生产环境必须提供}
      DAI_CORS_ORIGINS: ${DAI_CORS_ORIGINS:?DAI_CORS_ORIGINS 未设置，生产环境必须指定前端域名}
      DAI_JUDGE_IMAGE: ${DAI_JUDGE_IMAGE:?DAI_JUDGE_IMAGE 必须是已 smoke 的 digest 镜像引用}
      DAI_KERNEL_IMAGE: ${DAI_KERNEL_IMAGE:?DAI_KERNEL_IMAGE 必须是已 smoke 的 digest 镜像引用}
      # Settings 的生产启动校验仍要求固定基础镜像；AI worker 本身不会使用 Docker。
      DAI_ENV_BASE_IMAGE: "${DAI_ENV_BASE_IMAGE:?DAI_ENV_BASE_IMAGE 必须是带 @sha256: digest 的 python:3.12-slim 引用}"
      DAI_WORKER_ROLE: ai
      DAI_AI_ENABLED: ${DAI_AI_ENABLED:-false}
      DAI_AI_BASE_URL: ${DAI_AI_BASE_URL:-https://aihub.codingpython.cn}
      DAI_AI_API_KEY: ${DAI_AI_API_KEY:-}
      DAI_AI_MODEL: ${DAI_AI_MODEL:-deepseek-v4-flash}
      DAI_AI_TIMEOUT_SECONDS: ${DAI_AI_TIMEOUT_SECONDS:-60}
      DAI_AI_MAX_RETRIES: ${DAI_AI_MAX_RETRIES:-3}
      DAI_AI_TEST_GROUP_TIMEOUT_SECONDS: ${DAI_AI_TEST_GROUP_TIMEOUT_SECONDS:-120}
      DAI_AI_TEST_GROUP_MAX_RETRIES: ${DAI_AI_TEST_GROUP_MAX_RETRIES:-0}
      DAI_AI_QUEUE_NAME: ${DAI_AI_QUEUE_NAME:-judge:ai:queue}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    volumes:
      - app_logs:/app/logs

  # 环境档位构建 Worker（Phase 6）——单副本、单并发、低频管理任务
  # DB 是构建任务事实源，Redis list 只负责唤醒；构建由宿主机 Docker daemon 执行
  environment-builder:
    build: *backend-build
    restart: unless-stopped
    command: python -m app.worker.environment_builder_worker
    # 构建 Worker 必须连接 Docker socket，但自身不需要额外 Linux capability。
    # Docker daemon 侧仍需配合 rootless/隔离 BuildKit 做更强的宿主机边界控制。
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: ${DAI_ENV_BUILD_CPU_LIMIT:-2}
    mem_limit: ${DAI_ENV_BUILD_MEMORY_MB:-4096}m
    pids_limit: ${DAI_ENV_BUILD_PIDS_LIMIT:-512}
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    environment:
      DAI_ENVIRONMENT: ${DAI_ENVIRONMENT:-production}
      DAI_DATABASE_URL: mysql+pymysql://${DAI_DB_USER:?DAI_DB_USER 未设置}:${DAI_DB_PASSWORD:?DAI_DB_PASSWORD 未设置}@mysql:3306/dai_platform
      DAI_REDIS_URL: redis://redis:6379/0
      DAI_SECRET_KEY: ${DAI_SECRET_KEY:?DAI_SECRET_KEY 未设置，生产环境必须提供}
      DAI_CORS_ORIGINS: ${DAI_CORS_ORIGINS:?DAI_CORS_ORIGINS 未设置，生产环境必须指定前端域名}
      DAI_JUDGE_IMAGE: ${DAI_JUDGE_IMAGE:?DAI_JUDGE_IMAGE 必须是已 smoke 的 digest 镜像引用}
      DAI_KERNEL_IMAGE: ${DAI_KERNEL_IMAGE:?DAI_KERNEL_IMAGE 必须是已 smoke 的 digest 镜像引用}
      # 环境构建控制面——生产必须使用带 sha256 digest 的基础镜像引用（config.py 校验强制）
      DAI_ENV_BASE_IMAGE: "${DAI_ENV_BASE_IMAGE:?DAI_ENV_BASE_IMAGE 必须是带 @sha256: digest 的 python:3.12-slim 引用}"
      DAI_ENV_BUILD_QUEUE_NAME: ${DAI_ENV_BUILD_QUEUE_NAME:-environment:build:queue}
      DAI_ENV_BUILD_TIMEOUT_SECONDS: ${DAI_ENV_BUILD_TIMEOUT_SECONDS:-3600}
      DAI_ENV_IMAGE_REPOSITORY: ${DAI_ENV_IMAGE_REPOSITORY:-dai-env}
      DAI_ENVIRONMENT_EDITOR_V2_ENABLED: ${DAI_ENVIRONMENT_EDITOR_V2_ENABLED:-false}
      DAI_ENV_REGISTRY_REPOSITORY: ${DAI_ENV_REGISTRY_REPOSITORY:-}
      DAI_ENV_PYTHON_BASE_IMAGES: '${DAI_ENV_PYTHON_BASE_IMAGES:-{"3.10":"python:3.10-slim-bookworm","3.11":"python:3.11-slim-bookworm","3.12":"python:3.12-slim-bookworm"}}'
      DAI_ENV_PIP_INDEX_URL: ${DAI_ENV_PIP_INDEX_URL:-}
      DAI_ENV_APT_SNAPSHOT_SOURCES: '${DAI_ENV_APT_SNAPSHOT_SOURCES:-{}}'
      DAI_ENV_PLATFORM_PYTHON_PACKAGES: '${DAI_ENV_PLATFORM_PYTHON_PACKAGES:-{"ipykernel":"6.29.5","pytest":"8.3.4"}}'
      DAI_ENV_PLATFORM_BUNDLE_VERSION: ${DAI_ENV_PLATFORM_BUNDLE_VERSION:-v1}
      DAI_ENV_BUILD_NETWORK_MODE: ${DAI_ENV_BUILD_NETWORK_MODE:-default}
      DAI_ENV_BUILD_HTTP_PROXY: ${DAI_ENV_BUILD_HTTP_PROXY:-}
      DAI_ENV_BUILD_CPU_LIMIT: ${DAI_ENV_BUILD_CPU_LIMIT:-2}
      DAI_ENV_BUILD_MEMORY_MB: ${DAI_ENV_BUILD_MEMORY_MB:-4096}
      DAI_ENV_BUILD_PIDS_LIMIT: ${DAI_ENV_BUILD_PIDS_LIMIT:-512}
      DAI_ENV_BUILD_MAX_IMAGE_BYTES: ${DAI_ENV_BUILD_MAX_IMAGE_BYTES:-21474836480}
      DAI_ENV_BUILD_LOG_MAX_BYTES: ${DAI_ENV_BUILD_LOG_MAX_BYTES:-61440}
      DAI_ENV_BUILDER_HEARTBEAT_KEY: ${DAI_ENV_BUILDER_HEARTBEAT_KEY:-environment:v2:builder:heartbeat}
      DAI_ENV_BUILDER_HEARTBEAT_TTL_SECONDS: ${DAI_ENV_BUILDER_HEARTBEAT_TTL_SECONDS:-30}
      DAI_ENV_BUILDER_HEARTBEAT_INTERVAL_SECONDS: ${DAI_ENV_BUILDER_HEARTBEAT_INTERVAL_SECONDS:-10}
      DAI_ENV_REGISTRY_DOCKER_CONFIG: /run/secrets/config.json
      DAI_ENV_REGISTRY_ALLOW_ANONYMOUS: ${DAI_ENV_REGISTRY_ALLOW_ANONYMOUS:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    secrets:
      - source: dai_env_registry_docker_config
        target: config.json
    volumes:
      # 只挂载 Docker socket——构建镜像由宿主机 daemon 执行；不挂载学生工作目录
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build: *frontend-build
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      # -Y off：宿主 docker config.json 注入的 http_proxy 会劫持 wget；
      # 127.0.0.1：busybox wget 解析 localhost 优先 IPv6 ::1（未监听）不回落 IPv4
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

volumes:
  mysql_data:
  studio_data:
  # Immutable lab datasets and model artifacts; include in backups.
  lab_data:
  # Redis AOF 持久卷——重启/重建后认证状态不丢失，备份任务必须包含此卷
  redis_data:
  # 教师上传视频持久卷——容器重建后视频仍存在，备份任务必须包含此卷
  video_data:
  # 课程封面持久卷——必须纳入生产备份
  cover_data:
  # Private course materials: include this volume in backup/restore verification.
  material_data:
  # 应用文件日志（api/worker 共享，管理员日志页读取）
  app_logs:

networks:
  internal:
    driver: bridge
